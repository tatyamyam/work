<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<html>

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ToDoリスト</title>
</head>


<body>
	<h2>ToDoリスト</h2>
	<br>
	<table border="1">
		<thead>
			<tr>
				<th>ID</th>
				<th>タイトル</th>
				<th>優先度</th>
				<th>ステータス</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="todo : ${todos}">
    			<td th:text="${todo.getId()}"></td>
    			<td th:text="${todo.getTitle()}"></td>
    			<td th:text="${todo.getPriority().getLabel()}"></td>
    			<td th:text="${todo.getStatus().getLabel()}"></td>
			</tr>
		</tbody>
	</table>




</body>


</html>
